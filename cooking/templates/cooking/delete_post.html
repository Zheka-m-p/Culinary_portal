{% extends 'base.html' %}

{% block title %}Удаление рецепта{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5 border-danger">

            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">Удаление рецепта</h3>
            </div>

            <div class="card-body"> 
                <p class="fs-5">Вы уверены, что хотите удалить рецепт <strong>«{{ post.title }}»</strong>?</p>
                <p class="text-muted">Это действие невозможно отменить.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{{ post.get_absolute_url }}" class="btn btn-secondary">Отмена</a>

                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
