{% load static %}

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'cooking:index' %}">
            <img src="{% static 'images/icon-site.jpg' %}" style="max-height: 40px; width: auto;" alt="Логотип">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Переключатель навигации">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- Меню слева (me-auto прижимает остальное вправо) -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'cooking:index' %}">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Рецепты</a>
                </li>
            </ul>

            <!-- Поиск -->
            <form class="d-flex me-3" role="search">
                <input class="form-control me-2" type="search" placeholder="Поиск" aria-label="Поиск">
                <button class="btn btn-outline-success" type="submit">Поиск</button>
            </form>

            <!-- Пользователи справа -->
            <ul class="navbar-nav">
                {% if not user.is_authenticated %}

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'users:register' %}">Зарегистрироваться</a>
                </li>
                {% else %}
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">
                        Здравствуйте, {{user.username}}!
                    </a>
                    <!-- dropdown-menu-end чтобы меню не улетало за экран -->
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#">Моя страница</a></li>
                        <li><a class="dropdown-item" href="{% url 'cooking:add_post' %}">Добавить статью</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form method="post" action="{% url 'users:logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item">Выход</button>
                            </form>
                        </li>

                    </ul>
                </li>
                {% endif %}
            </ul>

        </div>
    </div>
</nav>
